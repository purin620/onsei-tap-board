<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="だれかな">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>だれかな クイズ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* 左に写真、右に五十音表（ことばでつたえよう と同じ表） */
html { box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
:root {
  --bg: #e6f4fb;
  --board: #ffffff;
  --ink: #1d2433;
  --sub: #4f5d73;
  --pink: #f4a7c3;
  --yellow: #f6d35b;
  --green: #8fd17f;
  --blue: #8cc8ef;
  --press: #ffe58a;
  --accent: #2a62b8;
  --danger: #c8434b;
  --ok: #e8505b;
  --kana: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "ヒラギノ丸ゴ ProN", "BIZ UDGothic", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--kana);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.app {
  height: 100%;
  box-sizing: border-box;
  display: grid;
  grid-template-columns: minmax(0, 32vw) minmax(0, 1fr);
  grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "pic say" "pic board" "pic tabs";
  gap: 1.2vmin;
  padding-block: 1.2vmin;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* 写真 */
.pic {
  grid-area: pic;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto auto;
  gap: 1.2vmin;
  min-height: 0;
}
.ask { margin: 0; text-align: center; font-size: 5.4vmin; font-weight: 900; color: var(--accent); }
.photo {
  background: #fff; border: 4px solid var(--blue); border-radius: 2.4vmin;
  min-height: 0; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
}
.photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.dots { display: flex; justify-content: center; gap: 1vmin; flex-wrap: wrap; }
.dot { width: 2.4vmin; height: 2.4vmin; border-radius: 50%; background: #fff; border: 2px solid var(--blue); }
.dot.done { background: var(--ok); border-color: var(--ok); }
.dot.now { background: var(--yellow); border-color: var(--yellow); }
.answer {
  font: 900 6vmin/1 var(--kana);
  padding: 2.4vmin 0;
  border-radius: 2.4vmin;
  border: 0; background: var(--ok); color: #fff;
  box-shadow: 0 1vmin 0 #b9343e;
}
.answer:active { transform: translateY(1vmin); box-shadow: none; }
.hint { margin: 0; text-align: center; font-size: 3.6vmin; font-weight: 900; color: var(--sub); }

/* 答えの文 */
.say { grid-area: say; display: grid; grid-template-columns: 1fr auto; gap: 1.2vmin; align-items: stretch; }
.line {
  background: var(--board); border: 3px solid var(--blue); border-radius: 2vmin;
  min-height: 11vmin; display: flex; align-items: center; padding: 0 2.4vmin;
  font-size: 7.5vmin; font-weight: 900; letter-spacing: .08em;
  overflow-x: auto; white-space: nowrap; min-width: 0;
}
.line .ph { color: #9fb3c8; font-size: 4.5vmin; letter-spacing: .1em; }
.tools { display: flex; gap: 1.2vmin; }
.tool {
  font: 900 3.4vmin/1.1 var(--kana);
  border: 3px solid var(--sub); background: var(--board); color: var(--ink);
  border-radius: 2vmin; padding: 0 2.2vmin; min-width: 13vmin;
}
.tool.clear { border-color: var(--danger); color: var(--danger); }
.tool:active { background: var(--press); }

/* 表（ことばでつたえよう と同じ） */
.board {
  grid-area: board;
  background: var(--board); border-radius: 2.4vmin; border: 4px solid var(--blue);
  padding: 1.2vmin; min-height: 0; display: grid; gap: 1vmin;
}
.k {
  font: 900 6.4vmin/1 var(--kana);
  color: var(--ink); background: #fff;
  border: 0.8vmin solid var(--c, var(--pink)); border-radius: 1.6vmin;
  display: flex; align-items: center; justify-content: center;
  padding: 0; min-width: 0; min-height: 0;
  transition: transform .08s ease;
}
.k:active, .k.on { background: var(--press); transform: scale(.94); }
.k.blank { background: #eaf4fb; border-color: #d6e9f6; }
.k.glow { animation: glow 1s ease-in-out infinite; }
@keyframes glow { 50% { background: var(--press); box-shadow: 0 0 0 1vmin var(--yellow); } }
#t-yoon .k { font-size: 4vmin; white-space: nowrap; letter-spacing: -0.04em; }
#t-yoon .k.small { font-size: 5.6vmin; flex-direction: column; gap: .6vmin; }
#t-yoon .k .cap { font-size: 2.2vmin; color: var(--sub); }

.tabs { grid-area: tabs; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.2vmin; }
.tab {
  font: 900 4.6vmin/1 var(--kana); padding: 1.6vmin 0; border-radius: 2vmin;
  border: 3px solid var(--blue); background: #fff; color: var(--sub);
}
.tab[aria-selected="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
.tab.glow { animation: glow 1s ease-in-out infinite; }

/* けっか */
.result {
  position: fixed; inset: 0; z-index: 10;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .92);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.rbox { text-align: center; display: grid; gap: 2.4vmin; justify-items: center; }
.rbox img { width: 34vmin; height: 34vmin; object-fit: contain; border-radius: 2vmin; background: #fff; border: 4px solid var(--blue); }
.big { margin: 0; font-size: 13vmin; font-weight: 900; line-height: 1; }
.mid { margin: 0; font-size: 6vmin; font-weight: 900; }
.ok .big { color: var(--ok); }
.ng .big { color: var(--accent); }
.hana { width: 30vmin; height: 30vmin; animation: pop .6s cubic-bezier(.2, 1.6, .4, 1) both; }
@keyframes pop { from { transform: scale(0) rotate(-90deg); } to { transform: scale(1) rotate(0); } }
.next {
  font: 900 6vmin/1 var(--kana); padding: 2.4vmin 6vmin; border-radius: 2.4vmin; border: 0;
  background: var(--accent); color: #fff; box-shadow: 0 1vmin 0 #1b4380;
}
.next:active { transform: translateY(1vmin); box-shadow: none; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 11; }
.confetti i { position: absolute; top: -4vmin; width: 2.4vmin; height: 3.6vmin; border-radius: .6vmin; animation: fall 2.4s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

/* せんせい用 */
.gear {
  position: fixed; right: calc(4px + env(safe-area-inset-right, 0px)); bottom: calc(4px + env(safe-area-inset-bottom, 0px));
  width: 28px; height: 28px; border-radius: 50%; border: 0; background: transparent; color: #b7c9da; font-size: 14px; z-index: 5;
}
.panel {
  position: fixed; inset: 0; background: rgba(29,36,51,.45); z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));
}
.sheet {
  background: #fff; color: var(--ink); border-radius: 16px; padding: 24px;
  width: min(620px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box;
  font: 700 16px/1.6 "Hiragino Sans", "BIZ UDGothic", sans-serif;
  display: grid; gap: 14px; -webkit-user-select: text; user-select: text;
}
.sheet h2 { margin: 0; font-size: 20px; }
.sheet h3 { margin: 8px 0 0; font-size: 17px; border-top: 2px solid #e1ecf5; padding-top: 14px; }
.sheet label { display: grid; gap: 6px; }
.sheet select, .sheet button, .sheet input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--blue); background: #fff; color: var(--ink); box-sizing: border-box; max-width: 100%; }
.sheet .note { font-weight: 400; color: var(--sub); font-size: 14px; margin: 0; }
.sheet .close { background: var(--accent); border-color: var(--accent); color: #fff; }
.mylist { display: grid; gap: 8px; }
.myitem { display: grid; grid-template-columns: 64px 1fr auto; gap: 10px; align-items: center; border: 2px solid #e1ecf5; border-radius: 10px; padding: 6px; }
.myitem img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; }
.myitem .del { border-color: var(--danger); color: var(--danger); padding: 6px 10px; }
.addrow { display: grid; gap: 10px; border: 2px dashed var(--blue); border-radius: 12px; padding: 12px; }
.warn {
  position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: #fff3c4; color: var(--ink); border: 2px solid var(--yellow);
  padding: 8px 16px; border-radius: 12px; font: 700 14px/1.4 "Hiragino Sans", sans-serif; z-index: 30;
  max-width: calc(100% - 32px);
}
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .k, .hana, .confetti i { transition: none; animation: none; } }

/* たて向き：写真を上に小さく */
@media (orientation: portrait) {
  .app {
    grid-template-columns: minmax(0, 40vw) minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "pic pic" "say say" "board board" "tabs tabs";
  }
  .pic { grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; height: 30vh; }
  .ask { grid-column: 2; grid-row: 1; }
  .photo { grid-column: 1; grid-row: 1 / 4; }
  .dots { grid-column: 2; grid-row: 2; }
  .answer { grid-column: 2; grid-row: 3; padding: 2.4vmin 4vmin; }
  .hint { grid-column: 2; grid-row: 2; }
  .k { font-size: 6vmin; }
  #t-yoon .k { font-size: 3.6vmin; }
}
</style>
</head>
<body>
<div class="app">
  <section class="pic">
    <p class="ask">だれかな？</p>
    <div class="photo"><img id="photo" alt="もんだいの しゃしん"></div>
    <p class="hint" id="hint" hidden></p>
    <div class="dots" id="dots"></div>
    <button class="answer" id="answer" type="button">こたえる</button>
  </section>

  <div class="say">
    <div class="line" id="line" aria-live="polite"><span class="ph">もじを おしてね</span></div>
    <div class="tools">
      <button class="tool" id="back" type="button">1もじ<br>けす</button>
      <button class="tool clear" id="clear" type="button">ぜんぶ<br>けす</button>
    </div>
  </div>

  <div class="board" id="t-seion" role="tabpanel"></div>
  <div class="board" id="t-daku" role="tabpanel" hidden></div>
  <div class="board" id="t-yoon" role="tabpanel" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab" type="button" role="tab" data-t="t-seion" aria-selected="true">あいう</button>
    <button class="tab" type="button" role="tab" data-t="t-daku" aria-selected="false">がぎぐ</button>
    <button class="tab" type="button" role="tab" data-t="t-yoon" aria-selected="false">きゃ・っ</button>
  </div>
</div>

<!-- せいかい -->
<div class="result ok" id="ok" hidden>
  <div class="rbox">
    <svg class="hana" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#e8505b" stroke-width="10" stroke-linecap="round">
        <circle cx="100" cy="100" r="40"/>
        <path d="M100 30a30 30 0 0 1 49 20a30 30 0 0 1 21 50a30 30 0 0 1-21 50a30 30 0 0 1-49 20a30 30 0 0 1-49-20a30 30 0 0 1-21-50a30 30 0 0 1 21-50a30 30 0 0 1 49-20z"/>
      </g>
    </svg>
    <p class="big">せいかい！</p>
    <p class="mid" id="okName"></p>
    <button class="next" id="next" type="button">つぎへ ▶</button>
  </div>
</div>

<!-- ちがう -->
<div class="result ng" id="ng" hidden>
  <div class="rbox">
    <p class="big">おしい！</p>
    <p class="mid">もういちど やってみよう</p>
    <button class="next" id="retry" type="button">もういちど</button>
  </div>
</div>

<!-- ぜんぶおわり -->
<div class="result ok" id="fin" hidden>
  <div class="rbox">
    <svg class="hana" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="#e8505b" stroke-width="10" stroke-linecap="round">
        <circle cx="100" cy="100" r="40"/>
        <path d="M100 30a30 30 0 0 1 49 20a30 30 0 0 1 21 50a30 30 0 0 1-21 50a30 30 0 0 1-49 20a30 30 0 0 1-49-20a30 30 0 0 1-21-50a30 30 0 0 1 21-50a30 30 0 0 1 49-20z"/>
      </g>
    </svg>
    <p class="big">ぜんぶ できたね！</p>
    <p class="mid">すごい！</p>
    <button class="next" id="again" type="button">もういちど あそぶ</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<button class="gear" id="gear" type="button" aria-label="せんせい用のせってい（ながおし）">⚙</button>

<div class="panel" id="panel" hidden>
  <div class="sheet">
    <h2>せんせい用のせってい</h2>
    <label>出す問題
      <select id="src">
        <option value="app">アプリに入っている問題</option>
        <option value="mine">このiPadで登録した問題</option>
        <option value="both">りょうほう</option>
      </select>
    </label>
    <label>問題のじゅんばん
      <select id="order">
        <option value="fixed">きまった じゅんばん</option>
        <option value="random">ばらばら</option>
      </select>
    </label>
    <label>ヒント（つぎの文字を光らせる）
      <select id="hintAfter">
        <option value="0">出さない</option>
        <option value="1">1回まちがえたら</option>
        <option value="2">2回まちがえたら</option>
        <option value="3">3回まちがえたら</option>
      </select>
    </label>
    <label>読み上げの速さ
      <select id="rate">
        <option value="0.6">とても ゆっくり</option>
        <option value="0.8">ゆっくり</option>
        <option value="1">ふつう</option>
      </select>
    </label>
    <label>声
      <select id="voice"><option value="">自動（日本語）</option></select>
    </label>

    <h3>このiPadで問題を登録する</h3>
    <p class="note">写真はこのiPadの中だけに保存され、インターネットには送られません。ほかのiPadでは見えません。</p>
    <div class="addrow">
      <label>写真 <input type="file" id="addFile" accept="image/*"></label>
      <label>正解の答え（ひらがな。いくつかある時は「、」で区切る）
        <input type="text" id="addKotae" placeholder="例：たなか、たなかせんせい" autocomplete="off">
      </label>
      <label>正解のときに出す名前（空欄なら最初の答え）
        <input type="text" id="addNamae" placeholder="例：たなか せんせい" autocomplete="off">
      </label>
      <button type="button" id="addBtn">登録する</button>
    </div>
    <div class="mylist" id="mylist"></div>

    <h3>問題ファイルを読み込む</h3>
    <p class="note">先生から受け取った問題ファイル（.json）を選ぶと、このiPadに問題が登録されます。写真はインターネットには送られません。</p>
    <label>問題ファイル <input type="file" id="importFile" accept=".json,application/json"></label>
    <button type="button" id="clearMine">このiPadで登録した問題を ぜんぶ けす</button>

    <button type="button" id="restart">さいしょから はじめる</button>
    <p class="note">右下の⚙を長押し（1.5秒）すると開きます。</p>
    <button type="button" class="close" id="closePanel">とじる</button>
  </div>
</div>
<div class="warn" id="warn" hidden></div>

<script src="mondai.js"></script>
<script>
(function () {
  // ---- 表（ことばでつたえよう と同じ並び：右はしが あ行） ----
  var SEION = [
    ["わ","","","を","ん"],
    ["ら","り","る","れ","ろ"],
    ["や","","ゆ","","よ"],
    ["ま","み","む","め","も"],
    ["は","ひ","ふ","へ","ほ"],
    ["な","に","ぬ","ね","の"],
    ["た","ち","つ","て","と"],
    ["さ","し","す","せ","そ"],
    ["か","き","く","け","こ"],
    ["あ","い","う","え","お"]
  ];
  var DAKU = [
    ["ぱ","ぴ","ぷ","ぺ","ぽ"],
    ["ば","び","ぶ","べ","ぼ"],
    ["だ","ぢ","づ","で","ど"],
    ["ざ","じ","ず","ぜ","ぞ"],
    ["が","ぎ","ぐ","げ","ご"]
  ];
  var YOON = [
    ["っ","ー",""],
    ["ぴゃ","ぴゅ","ぴょ"],
    ["びゃ","びゅ","びょ"],
    ["じゃ","じゅ","じょ"],
    ["ぎゃ","ぎゅ","ぎょ"],
    ["りゃ","りゅ","りょ"],
    ["みゃ","みゅ","みょ"],
    ["ひゃ","ひゅ","ひょ"],
    ["にゃ","にゅ","にょ"],
    ["ちゃ","ちゅ","ちょ"],
    ["しゃ","しゅ","しょ"],
    ["きゃ","きゅ","きょ"]
  ];
  var SAY = { "っ": "ちいさい つ", "ー": "のばす" };
  var COLORS = ["var(--pink)", "var(--yellow)", "var(--green)", "var(--blue)"];
  var PRAISE = ["すごいね！", "やったね！", "よく わかったね！", "かんぺき！"];

  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
  function $(id) { return document.getElementById(id); }

  var text = [];
  var lineEl = $("line");
  function render() {
    if (!text.length) { lineEl.innerHTML = '<span class="ph">もじを おしてね</span>'; return; }
    lineEl.textContent = text.join("");
    lineEl.scrollLeft = lineEl.scrollWidth;
  }

  // ---- 読み上げ ----
  var synth = window.speechSynthesis;
  var voices = [];
  function loadVoices() {
    if (!synth) return;
    voices = synth.getVoices().filter(function (v) { return /^ja/i.test(v.lang); });
    var sel = $("voice");
    var keep = store("quiz.voice") || "";
    sel.innerHTML = '<option value="">自動（日本語）</option>';
    voices.forEach(function (v) { var o = document.createElement("option"); o.value = v.name; o.textContent = v.name; sel.appendChild(o); });
    sel.value = keep;
  }
  if (synth) { loadVoices(); synth.onvoiceschanged = loadVoices; }
  function speak(s, keep) {
    if (!synth || !window.SpeechSynthesisUtterance) return null;
    if (!keep) synth.cancel();
    var u = new SpeechSynthesisUtterance(s);
    u.lang = "ja-JP";
    u.rate = parseFloat(store("quiz.rate") || "0.8");
    var name = store("quiz.voice");
    var v = voices.filter(function (x) { return x.name === name; })[0] || voices[0];
    if (v) u.voice = v;
    synth.speak(u);
    if (synth.paused) synth.resume();
    return u;
  }

  // ---- 表をつくる ----
  var keyTab = {};
  function build(id, cols) {
    var el = $(id);
    var rows = cols[0].length;
    el.style.gridTemplateColumns = "repeat(" + cols.length + ", 1fr)";
    el.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols.length; c++) {
        var ch = cols[c][r];
        var b = document.createElement("button");
        b.type = "button";
        b.className = "k";
        if (!ch) { b.className += " blank"; b.disabled = true; b.setAttribute("aria-hidden", "true"); }
        else {
          b.textContent = ch;
          b.dataset.ch = ch;
          keyTab[ch] = id;
          if (ch === "っ") { b.className += " small"; b.innerHTML = '<span class="cap">ちいさい</span><span>っ</span>'; }
          b.style.setProperty("--c", COLORS[(c + r) % 4]);
        }
        el.appendChild(b);
      }
    }
  }
  build("t-seion", SEION);
  build("t-daku", DAKU);
  build("t-yoon", YOON);

  function press(b) {
    var ch = b.dataset.ch;
    text = text.concat([ch]);
    render();
    speak(SAY[ch] || ch);
    b.classList.add("on");
    setTimeout(function () { b.classList.remove("on"); }, 220);
    if (hintOn) showHint();
  }
  document.querySelectorAll(".board").forEach(function (bd) {
    bd.addEventListener("click", function (e) {
      var b = e.target.closest(".k");
      if (b && b.dataset.ch) press(b);
    });
  });
  $("back").addEventListener("click", function () { text = text.slice(0, -1); render(); if (hintOn) showHint(); });
  $("clear").addEventListener("click", function () { text = []; render(); if (hintOn) showHint(); });

  var tabs = document.querySelectorAll(".tab");
  function openTab(id) {
    tabs.forEach(function (x) {
      var on = x.dataset.t === id;
      x.setAttribute("aria-selected", on ? "true" : "false");
      $(x.dataset.t).hidden = !on;
    });
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { openTab(t.dataset.t); }); });

  // ---- このiPadで登録した問題（IndexedDB） ----
  var db = null;
  function openDB(cb) {
    if (db) return cb(db);
    try {
      var req = indexedDB.open("dareka-quiz", 1);
      req.onupgradeneeded = function () { req.result.createObjectStore("mondai", { keyPath: "id", autoIncrement: true }); };
      req.onsuccess = function () { db = req.result; cb(db); };
      req.onerror = function () { cb(null); };
    } catch (e) { cb(null); }
  }
  function getMine(cb) {
    openDB(function (d) {
      if (!d) return cb([]);
      var out = [];
      var cur = d.transaction("mondai").objectStore("mondai").openCursor();
      cur.onsuccess = function () { var c = cur.result; if (c) { out.push(c.value); c.continue(); } else cb(out); };
      cur.onerror = function () { cb(out); };
    });
  }
  function putMine(item, cb) {
    openDB(function (d) {
      if (!d) { showWarn("このiPadでは保存できませんでした。"); return; }
      var tx = d.transaction("mondai", "readwrite");
      tx.objectStore("mondai").add(item);
      tx.oncomplete = cb;
      tx.onerror = function () { showWarn("保存できませんでした（容量がいっぱいかもしれません）。"); };
    });
  }
  function delMine(id, cb) {
    openDB(function (d) { if (!d) return; var tx = d.transaction("mondai", "readwrite"); tx.objectStore("mondai").delete(id); tx.oncomplete = cb; });
  }

  // ---- クイズ ----
  var quiz = [], idx = 0, miss = 0, hintOn = false, doneCount = 0;
  function norm(s) { return String(s).replace(/[\s　・]/g, ""); }

  function loadQuiz() {
    var src = store("quiz.src") || "app";
    var base = (window.MONDAI || []).map(function (m) { return { img: m.shashin, kotae: m.kotae, namae: m.namae }; });
    getMine(function (mine) {
      mine = mine.map(function (m) { return { img: m.img, kotae: m.kotae, namae: m.namae }; });
      quiz = src === "app" ? base : src === "mine" ? mine : base.concat(mine);
      if (!quiz.length) quiz = base;
      if ((store("quiz.order") || "fixed") === "random") {
        for (var i = quiz.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = quiz[i]; quiz[i] = quiz[j]; quiz[j] = t; }
      }
      idx = 0; doneCount = 0;
      show();
    });
  }

  function show() {
    var q = quiz[idx];
    text = []; render(); miss = 0; clearHint();
    openTab("t-seion");
    $("photo").src = q ? q.img : "";
    var dots = $("dots"); dots.innerHTML = "";
    quiz.forEach(function (_, i) {
      var d = document.createElement("span");
      d.className = "dot" + (i < idx ? " done" : i === idx ? " now" : "");
      dots.appendChild(d);
    });
    ["ok", "ng", "fin"].forEach(function (id) { $(id).hidden = true; });
  }

  function isRight() {
    var a = norm(text.join(""));
    return quiz[idx].kotae.some(function (k) { return norm(k) === a; });
  }

  $("answer").addEventListener("click", function () {
    if (!text.length) { speak("もじを おしてね"); return; }
    var right = isRight();
    var u = speak(text.join(""));
    var go = function () {
      if (right) showOK(); else showNG();
    };
    // 入力したことばを読んでから、けっかを出す
    var fired = false;
    function once() { if (!fired) { fired = true; go(); } }
    if (u) { u.onend = once; u.onerror = once; setTimeout(once, 1200 + text.length * 600); } else once();
  });

  function showOK() {
    var q = quiz[idx];
    var p = PRAISE[Math.floor(Math.random() * PRAISE.length)];
    $("okName").textContent = text.join("") + "　" + p;
    $("ok").hidden = false;
    confetti();
    speak("せいかい！ " + p);
    clearHint();
  }
  function showNG() {
    miss++;
    text = []; render(); // まちがえたら入力した文字を消す
    $("ng").hidden = false;
    speak("おしい！ もういちど やってみよう");
  }
  $("retry").addEventListener("click", function () {
    $("ng").hidden = true;
    var n = parseInt(store("quiz.hintAfter") || "2", 10);
    if (n > 0 && miss >= n) { hintOn = true; showHint(); }
  });
  $("next").addEventListener("click", function () {
    idx++;
    if (idx >= quiz.length) { $("ok").hidden = true; $("fin").hidden = false; confetti(); speak("ぜんぶ できたね！ すごい！"); return; }
    show();
  });
  $("again").addEventListener("click", loadQuiz);

  // ---- ヒント：つぎに おす文字を光らせる ----
  function clearHint() {
    hintOn = false;
    $("hint").hidden = true;
    document.querySelectorAll(".glow").forEach(function (e) { e.classList.remove("glow"); });
  }
  function showHint() {
    document.querySelectorAll(".glow").forEach(function (e) { e.classList.remove("glow"); });
    var now = norm(text.join(""));
    var ks = quiz[idx].kotae.map(norm);
    var ans = ks.filter(function (k) { return k.indexOf(now) === 0; })[0] || ks[0];
    var h = $("hint");
    h.hidden = false;
    if (ans.indexOf(now) !== 0) { h.textContent = "1もじ けして みよう"; $("back").classList.add("glow"); return; }
    if (now === ans) { h.textContent = "「こたえる」を おしてね"; $("answer").classList.add("glow"); return; }
    var rest = ans.slice(now.length);
    var key = keyTab[rest.slice(0, 2)] ? rest.slice(0, 2) : rest.charAt(0);
    var tab = keyTab[key];
    h.textContent = "ひかる もじを おしてね";
    var b = document.querySelector('.k[data-ch="' + key + '"]');
    if (b) b.classList.add("glow");
    if (tab && $(tab).hidden) { var t = document.querySelector('.tab[data-t="' + tab + '"]'); if (t) t.classList.add("glow"); }
  }
  tabs.forEach(function (t) { t.addEventListener("click", function () { t.classList.remove("glow"); }); });

  function confetti() {
    var box = $("confetti");
    var cs = ["#e8505b", "#f6d35b", "#8fd17f", "#8cc8ef", "#f4a7c3"];
    box.innerHTML = "";
    for (var i = 0; i < 40; i++) {
      var p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = cs[i % cs.length];
      p.style.animationDelay = Math.random() * 0.8 + "s";
      box.appendChild(p);
    }
    setTimeout(function () { box.innerHTML = ""; }, 3500);
  }

  // ---- 集中のための工夫 ----
  document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
  document.addEventListener("dblclick", function (e) { e.preventDefault(); });
  document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  document.addEventListener("touchmove", function (e) {
    if (!e.target.closest(".line") && !e.target.closest(".sheet")) e.preventDefault();
  }, { passive: false });

  // ---- せんせい用（⚙を1.5秒ながおし） ----
  var panel = $("panel"), gear = $("gear"), timer = null;
  function startHold() { timer = setTimeout(function () { panel.hidden = false; drawMine(); }, 1500); }
  function endHold() { clearTimeout(timer); }
  gear.addEventListener("touchstart", startHold, { passive: true });
  gear.addEventListener("touchend", endHold);
  gear.addEventListener("mousedown", startHold);
  gear.addEventListener("mouseup", endHold);
  gear.addEventListener("mouseleave", endHold);

  function bindSel(id, key, def, onChange) {
    var el = $(id);
    el.value = store(key) || def;
    el.addEventListener("change", function () { store(key, el.value); if (onChange) onChange(); });
  }
  bindSel("src", "quiz.src", "app", loadQuiz);
  bindSel("order", "quiz.order", "fixed", loadQuiz);
  bindSel("hintAfter", "quiz.hintAfter", "2");
  bindSel("rate", "quiz.rate", "0.8");
  $("voice").addEventListener("change", function () { store("quiz.voice", $("voice").value); });
  $("restart").addEventListener("click", function () { panel.hidden = true; loadQuiz(); });
  $("closePanel").addEventListener("click", function () { panel.hidden = true; });

  $("importFile").addEventListener("change", function () {
    var f = this.files[0]; var input = this;
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var list;
      try { var d = JSON.parse(r.result); list = d.mondai || d; } catch (e) { list = null; }
      if (!Array.isArray(list) || !list.length) { showWarn("問題ファイルを読みこめませんでした。"); return; }
      list = list.filter(function (m) { return m && m.img && Array.isArray(m.kotae) && m.kotae.length; });
      var left = list.length;
      if (!left) { showWarn("問題ファイルを読みこめませんでした。"); return; }
      list.forEach(function (m) {
        putMine({ img: m.img, kotae: m.kotae.map(norm), namae: m.namae || m.kotae[0] }, function () {
          if (--left === 0) {
            input.value = "";
            store("quiz.src", "mine"); $("src").value = "mine";
            showWarn(list.length + "問 登録しました。");
            drawMine(); loadQuiz();
          }
        });
      });
    };
    r.readAsText(f);
  });
  $("clearMine").addEventListener("click", function () {
    openDB(function (d) {
      if (!d) return;
      var tx = d.transaction("mondai", "readwrite"); tx.objectStore("mondai").clear();
      tx.oncomplete = function () { showWarn("けしました。"); drawMine(); loadQuiz(); };
    });
  });

  function drawMine() {
    getMine(function (list) {
      var box = $("mylist"); box.innerHTML = "";
      if (!list.length) { box.innerHTML = '<p class="note">まだ登録した問題はありません。</p>'; return; }
      list.forEach(function (m) {
        var row = document.createElement("div"); row.className = "myitem";
        var im = document.createElement("img"); im.src = m.img; im.alt = "";
        var tx = document.createElement("div"); tx.textContent = m.kotae.join("、");
        var del = document.createElement("button"); del.type = "button"; del.className = "del"; del.textContent = "けす";
        del.addEventListener("click", function () { delMine(m.id, function () { drawMine(); loadQuiz(); }); });
        row.appendChild(im); row.appendChild(tx); row.appendChild(del);
        box.appendChild(row);
      });
    });
  }

  // 写真を小さくしてから保存（iPadの容量をつかいすぎないように）
  function shrink(file, cb) {
    var r = new FileReader();
    r.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 800, w = img.width, h = img.height, s = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement("canvas");
        cv.width = Math.round(w * s); cv.height = Math.round(h * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        cb(cv.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = function () { showWarn("この写真は読みこめませんでした。"); };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  }
  $("addBtn").addEventListener("click", function () {
    var f = $("addFile").files[0];
    var kotae = $("addKotae").value.split(/[、,，\/]/).map(norm).filter(Boolean);
    if (!f) { showWarn("写真をえらんでください。"); return; }
    if (!kotae.length) { showWarn("正解の答えを入れてください。"); return; }
    if (kotae.some(function (k) { return /[^ぁ-ゖー]/.test(k); })) { showWarn("答えはひらがなで入れてください。"); return; }
    var namae = $("addNamae").value.trim() || kotae[0];
    shrink(f, function (dataUrl) {
      putMine({ img: dataUrl, kotae: kotae, namae: namae }, function () {
        $("addFile").value = ""; $("addKotae").value = ""; $("addNamae").value = "";
        showWarn("登録しました。");
        drawMine(); loadQuiz();
      });
    });
  });

  var warn = $("warn");
  function showWarn(m) { warn.textContent = m; warn.hidden = false; setTimeout(function () { warn.hidden = true; }, 4000); }

  loadQuiz();
})();
</script>
</body>
</html>
