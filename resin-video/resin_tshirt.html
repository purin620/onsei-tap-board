<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tシャツがた レジン てじゅん</title>
<style>
  :root { --bg: #222; }
  html, body { margin: 0; background: var(--bg); }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif; color: #eee; }
  canvas { width: min(100vw, 177.78vh); height: auto; display: block; }
  #ui { padding: 8px; font-size: 14px; display: flex; gap: 8px; align-items: center; width: min(96vw, 900px); }
  #ui input { flex: 1; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><button id="pp">⏸</button><input id="seek" type="range" min="0" max="59.5" step="0.01" value="0"><span id="tm">0.0</span></div>
<script>
'use strict';
// ===== 基本設定 =====
const W = 1280, H = 720, SCALE = 1.5;
const DURATION = 59.5;
const canvas = document.getElementById('c');
canvas.width = W * SCALE; canvas.height = H * SCALE;
const ctx = canvas.getContext('2d');
const shC = document.createElement('canvas');
shC.width = canvas.width; shC.height = canvas.height;
const shCtx = shC.getContext('2d');
const FONT = '"IPAGothic","IPAPGothic","Noto Sans CJK JP",sans-serif';

const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => 0.5 - 0.5 * Math.cos(Math.PI * clamp(u));
const easeOut = u => 1 - Math.pow(1 - clamp(u), 3);
const prog = (t, a, b) => clamp((t - a) / (b - a));
const TAU = Math.PI * 2;
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let x = Math.imul(seed ^ seed >>> 15, 1 | seed); x = x + Math.imul(x ^ x >>> 7, 61 | x) ^ x; return ((x ^ x >>> 14) >>> 0) / 4294967296; }; }

// キーフレーム補間（数値・配列を補間、その他は前のキーの値を保持）
function track(keys) {
  keys.sort((a, b) => a.t - b.t);
  return t => {
    if (t <= keys[0].t) return { ...keys[0] };
    for (let i = 0; i < keys.length - 1; i++) {
      const a = keys[i], b = keys[i + 1];
      if (t > b.t) continue;
      const u = (b.e || ease)((t - a.t) / (b.t - a.t));
      const o = {};
      for (const k in a) {
        if (k === 't' || k === 'e' || k === 'arc') continue;
        const va = a[k], vb = b[k];
        if (Array.isArray(va) && Array.isArray(vb)) o[k] = va.map((v, j) => lerp(v, vb[j], u));
        else if (typeof va === 'number' && typeof vb === 'number') o[k] = lerp(va, vb, u);
        else o[k] = u >= 1 ? vb : va;
      }
      if (b.arc && 'x' in a) {
        const dx = b.x - a.x, dy = b.y - a.y, s = b.arc * Math.sin(Math.PI * u);
        o.x += -dy * s; o.y += dx * s;
      }
      return o;
    }
    return { ...keys[keys.length - 1] };
  };
}
// 人の手らしい、わずかなゆれ
const tremor = (t, k = 1) => [k * (0.7 * Math.sin(t * 2.1) + 0.4 * Math.sin(t * 3.7 + 1.3)), k * (0.6 * Math.sin(t * 1.7 + 0.4) + 0.4 * Math.sin(t * 4.3 + 2.2))];

// ===== 配置 =====
const MOLD = { x: 640, y: 320, s: 260 };
const COLORS = {
  red: { liq: '#f2545b', dark: '#c23940', name: 'あか' },
  blue: { liq: '#2f80ed', dark: '#1d5fc0', name: 'あお' },
  yellow: { liq: '#f7c531', dark: '#cf9d0e', name: 'きいろ' },
};
const BOTTLES = [
  { key: 'red', x: 210, y: 190 },
  { key: 'blue', x: 210, y: 320 },
  { key: 'yellow', x: 210, y: 450 },
];
const TRAY = { x: 945, y: 160, w: 230, h: 320 };
const COMP = [
  { cx: 1004.5, cy: 243.5, label: 'ほし' },
  { cx: 1115.5, cy: 243.5, label: 'らめ' },
  { cx: 1004.5, cy: 399.5, label: 'はーと' },
  { cx: 1115.5, cy: 399.5, label: 'ぱーる' },
];
const HERO_STAR = { x: 1003, y: 236, r: 19 };
const PLACE = [640, 334];

// ===== 手のリグ =====
// 右手を甲側（上）から見た形。手首が原点、指先は -y 方向。
const FING = [
  { b: [-29, -90], L: [40, 25, 21], w: 19, a: -0.07, sp: -0.16 },
  { b: [-9, -96], L: [44, 28, 22], w: 19.5, a: 0, sp: -0.04 },
  { b: [11, -93], L: [41, 26, 21], w: 18.5, a: 0.06, sp: 0.08 },
  { b: [29, -83], L: [32, 20, 18], w: 16, a: 0.15, sp: 0.2 },
];
const THUMB = { b: [-36, -34], L: [32, 27, 22], w: 22, a: -0.9, sp: -0.18 };
const FLEX = [1.35, 1.6, 1.15], TFLEX = [0.5, 0.9, 0.9];
const PALM = [[-38, 10], [-44, -28], [-47, -62], [-42, -87], [-28, -98], [-9, -103], [11, -100], [28, -92], [40, -80], [44, -50], [41, -15], [36, 10]];
const GRIP_OFF = [32, -62];

const POSE = {
  relax: { curl: [0.25, 0.2, 0.25, 0.3, 0.35], spread: 0.3, thumbAng: 0 },
  point: { curl: [0.55, 0.0, 0.97, 1.0, 1.0], spread: 0.0, thumbAng: 0.55 },
  open: { curl: [0.05, 0.06, 0.06, 0.08, 0.1], spread: 0.85, thumbAng: -0.25 },
  grip: { curl: [0.6, 0.78, 0.8, 0.83, 0.86], spread: 0.08, thumbAng: 0.3 },
  pinch: { curl: [0.3, 0.3, 0.78, 0.9, 0.95], spread: 0.1, thumbAng: 0.2 },
};

function fingerChain(base, ang, L, flex, c) {
  const d = [Math.sin(ang), -Math.cos(ang)];
  const pts = [base.slice()], proj = [];
  let cum = 0, p = base.slice();
  for (let k = 0; k < 3; k++) {
    cum += flex[k] * c;
    const pl = L[k] * Math.cos(cum);
    p = [p[0] + d[0] * pl, p[1] + d[1] * pl];
    pts.push(p); proj.push(pl / L[k]);
  }
  return { pts, proj, d, L };
}
function projLen(L, flex, c) { let cum = 0, s = 0; for (let k = 0; k < 3; k++) { cum += flex[k] * c; s += L[k] * Math.cos(cum); } return s; }
// 指先を目標点に届かせる（上からの見かけの長さ＝曲げ具合）
function reach(base, tgt, L, flex) {
  const dx = tgt[0] - base[0], dy = tgt[1] - base[1];
  const ang = Math.atan2(dx, -dy), d = Math.hypot(dx, dy);
  let lo = 0, hi = 1;
  if (d >= projLen(L, flex, 0)) return { ang, c: 0 };
  for (let i = 0; i < 24; i++) { const m = (lo + hi) / 2; if (projLen(L, flex, m) > d) lo = m; else hi = m; }
  return { ang, c: (lo + hi) / 2 };
}
function handGeo(p) {
  const fingers = FING.map((f, i) => {
    let ang = f.a + p.spread * f.sp, c = p.curl[i + 1];
    const tg = p.ovr && p.ovr[i + 1];
    if (tg) ({ ang, c } = reach(f.b, tg, f.L, FLEX));
    return { ...fingerChain(f.b, ang, f.L, FLEX, c), w: f.w, c };
  });
  let tang = THUMB.a + p.thumbAng * 0.7 + p.spread * THUMB.sp, tc = p.curl[0];
  if (p.ovr && p.ovr[0]) ({ ang: tang, c: tc } = reach(THUMB.b, p.ovr[0], THUMB.L, TFLEX));
  const thumb = { ...fingerChain(THUMB.b, tang, THUMB.L, TFLEX, tc), w: THUMB.w, c: tc };
  return { fingers, thumb };
}
const handK = (p, st) => st.scale * (1 + 0.07 * p.z);
function toWorld(p, k, lp) { const c = Math.cos(p.rot), s = Math.sin(p.rot); return [p.x + (lp[0] * c - lp[1] * s) * k, p.y + (lp[0] * s + lp[1] * c) * k]; }
function wristFor(p, lp, tg, scale) { const k = scale * (1 + 0.07 * p.z), c = Math.cos(p.rot), s = Math.sin(p.rot); return { x: tg[0] - (lp[0] * c - lp[1] * s) * k, y: tg[1] - (lp[0] * s + lp[1] * c) * k }; }

// ===== ピンセット =====
function tweezGeo(s) {
  const B = [-80, -6], T = [-26, -212];
  const ux = T[0] - B[0], uy = T[1] - B[1], len = Math.hypot(ux, uy);
  const u = [ux / len, uy / len], n = [-u[1], u[0]];
  return { B, T, u, n, len, gap: lerp(24, 1.2, clamp(s)) };
}
function armPt(tw, f, side, extra = 0) {
  const off = side * (2.6 + (tw.gap / 2 - 2.6) * Math.pow(f, 1.3) + extra);
  return [tw.B[0] + tw.u[0] * tw.len * f + tw.n[0] * off, tw.B[1] + tw.u[1] * tw.len * f + tw.n[1] * off];
}
function drawTweezers(g, tw, sil) {
  for (const side of [-1, 1]) {
    const N = 16, left = [], right = [];
    for (let i = 0; i <= N; i++) {
      const f = i / N, w = lerp(4.4, 1.7, f);
      const c = armPt(tw, f, side);
      left.push([c[0] - tw.n[0] * w, c[1] - tw.n[1] * w]);
      right.push([c[0] + tw.n[0] * w, c[1] + tw.n[1] * w]);
    }
    g.beginPath(); g.moveTo(...left[0]);
    left.forEach(q => g.lineTo(...q));
    for (let i = right.length - 1; i >= 0; i--) g.lineTo(...right[i]);
    g.closePath();
    if (sil) { g.fillStyle = '#000'; g.fill(); continue; }
    const gr = g.createLinearGradient(tw.B[0], tw.B[1], tw.T[0], tw.T[1]);
    gr.addColorStop(0, '#aeb8c3'); gr.addColorStop(0.5, '#e9eef3'); gr.addColorStop(1, '#b9c3cd');
    g.fillStyle = gr; g.fill();
    g.strokeStyle = '#66717d'; g.lineWidth = 1.2; g.stroke();
    // 光沢
    g.beginPath();
    const h0 = armPt(tw, 0.08, side, -0.8), h1 = armPt(tw, 0.85, side, -0.8);
    g.moveTo(...h0); g.lineTo(...h1);
    g.strokeStyle = 'rgba(255,255,255,0.8)'; g.lineWidth = 0.9; g.stroke();
    // すべりどめ
    g.strokeStyle = 'rgba(80,90,100,0.55)'; g.lineWidth = 0.8;
    for (let f = 0.42; f < 0.62; f += 0.035) {
      const c = armPt(tw, f, side);
      g.beginPath(); g.moveTo(c[0] - tw.n[0] * 2.2 - tw.u[0] * 1.5, c[1] - tw.n[1] * 2.2 - tw.u[1] * 1.5); g.lineTo(c[0] + tw.n[0] * 2.2 + tw.u[0] * 1.5, c[1] + tw.n[1] * 2.2 + tw.u[1] * 1.5); g.stroke();
    }
  }
  g.beginPath(); g.arc(tw.B[0], tw.B[1], 4.6, 0, TAU);
  g.fillStyle = sil ? '#000' : '#9aa5b1'; g.fill();
  if (!sil) { g.strokeStyle = '#66717d'; g.lineWidth = 1; g.stroke(); }
}

// ===== 手の描画 =====
function smoothClosed(g, pts) {
  const n = pts.length, m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  g.beginPath(); g.moveTo(...m(pts[n - 1], pts[0]));
  for (let i = 0; i < n; i++) { const nx = m(pts[i], pts[(i + 1) % n]); g.quadraticCurveTo(pts[i][0], pts[i][1], nx[0], nx[1]); }
  g.closePath();
}
function drawFinger(g, f, st, sil) {
  const segs = [];
  for (let k = 0; k < 3; k++) { if (f.proj[k] <= 0.04) break; segs.push(k); }
  const wk = [1, 0.93, 0.86].map(v => v * f.w);
  g.lineCap = 'round'; g.lineJoin = 'round';
  const base = f.pts[0];
  if (!segs.length) { // にぎりこんだ指はこぶしの山だけ見える
    g.beginPath(); g.arc(base[0] + f.d[0] * 3, base[1] + f.d[1] * 3, f.w / 2, 0, TAU);
    g.fillStyle = sil ? '#000' : st.skin; g.fill();
    if (!sil) { g.strokeStyle = st.line; g.lineWidth = 1.5; g.stroke(); }
    return;
  }
  if (!sil) {
    g.strokeStyle = st.line;
    for (const k of segs) {
      const a = k === 0 ? [base[0] + f.d[0] * 6, base[1] + f.d[1] * 6] : f.pts[k];
      g.lineWidth = wk[k] + 3; g.beginPath(); g.moveTo(...a); g.lineTo(...f.pts[k + 1]); g.stroke();
    }
  }
  g.strokeStyle = sil ? '#000' : st.skin;
  for (const k of segs) {
    const a = k === 0 ? [base[0] - f.d[0] * 3, base[1] - f.d[1] * 3] : f.pts[k];
    g.lineWidth = wk[k]; g.beginPath(); g.moveTo(...a); g.lineTo(...f.pts[k + 1]); g.stroke();
  }
  if (sil) return;
  // 指の中心に少し明るいすじ（立体感）
  g.strokeStyle = 'rgba(255,240,228,0.45)';
  for (const k of segs) { g.lineWidth = wk[k] * 0.35; g.beginPath(); g.moveTo(f.pts[k][0] - f.d[1] * 2, f.pts[k][1] + f.d[0] * 2); g.lineTo(f.pts[k + 1][0] - f.d[1] * 2, f.pts[k + 1][1] + f.d[0] * 2); g.stroke(); }
  // 関節のしわ
  const perp = [-f.d[1], f.d[0]];
  g.strokeStyle = st.shade; g.lineWidth = 1.1;
  for (const k of segs) {
    if (k === 0) continue;
    const j = f.pts[k], hw = wk[k] * 0.28;
    for (const o of [-1.5, 1.5]) { g.beginPath(); g.moveTo(j[0] - perp[0] * hw + f.d[0] * o, j[1] - perp[1] * hw + f.d[1] * o); g.quadraticCurveTo(j[0] + f.d[0] * (o + 1.2), j[1] + f.d[1] * (o + 1.2), j[0] + perp[0] * hw + f.d[0] * o, j[1] + perp[1] * hw + f.d[1] * o); g.stroke(); }
  }
  // こぶし（曲げると目立つ）
  if (f.c > 0.25) {
    g.fillStyle = `rgba(255,236,220,${0.5 * clamp((f.c - 0.25) * 2)})`;
    g.beginPath(); g.ellipse(base[0] + f.d[0] * 2, base[1] + f.d[1] * 2, f.w * 0.32, f.w * 0.24, Math.atan2(f.d[1], f.d[0]), 0, TAU); g.fill();
  }
  // つめ
  if (segs.length === 3 && f.proj[2] > 0.3) {
    const tip = f.pts[3], pl = f.L[2] * f.proj[2];
    const len = pl * 0.62, cx = tip[0] - f.d[0] * (len / 2 + 1.5), cy = tip[1] - f.d[1] * (len / 2 + 1.5);
    g.beginPath(); g.ellipse(cx, cy, len / 2, wk[2] * 0.3, Math.atan2(f.d[1], f.d[0]), 0, TAU);
    g.fillStyle = st.nail; g.fill(); g.strokeStyle = st.shade; g.lineWidth = 0.9; g.stroke();
    g.beginPath(); g.ellipse(cx - f.d[0] * len * 0.12, cy - f.d[1] * len * 0.12, len * 0.22, wk[2] * 0.1, Math.atan2(f.d[1], f.d[0]), 0, TAU);
    g.fillStyle = 'rgba(255,255,255,0.6)'; g.fill();
  }
}
function handLayer(g, p, geo, st, sil) {
  const skin = sil ? '#000' : st.skin;
  g.lineJoin = 'round';
  // うで
  g.beginPath(); g.moveTo(-37, 4); g.quadraticCurveTo(-41, 40, -43, 80); g.lineTo(43, 80); g.quadraticCurveTo(40, 40, 36, 4); g.closePath();
  g.fillStyle = skin; g.fill();
  if (!sil) { g.strokeStyle = st.line; g.lineWidth = 2.5; g.stroke(); }
  // そで
  g.beginPath(); g.roundRect(-60, 52, 120, 720, 20); g.fillStyle = sil ? '#000' : st.sleeve; g.fill();
  if (!sil) {
    g.strokeStyle = st.sleeveLine; g.lineWidth = 2.5; g.stroke();
    g.beginPath(); g.roundRect(-60, 52, 120, 24, [20, 20, 4, 4]); g.fillStyle = st.cuff; g.fill(); g.stroke();
    g.strokeStyle = 'rgba(0,0,0,0.12)'; g.lineWidth = 3;
    for (const x of [-25, 18]) { g.beginPath(); g.moveTo(x, 95); g.quadraticCurveTo(x + 6, 200, x - 4, 330); g.stroke(); }
  }
  if (!st.thumbTop) drawFinger(g, geo.thumb, st, sil);
  // 手の甲
  smoothClosed(g, PALM); g.fillStyle = skin; g.fill();
  if (!sil) {
    g.strokeStyle = st.line; g.lineWidth = 2.5; g.stroke();
    const gr = g.createRadialGradient(-2, -60, 5, -2, -55, 55);
    gr.addColorStop(0, 'rgba(255,240,228,0.55)'); gr.addColorStop(1, 'rgba(255,240,228,0)');
    smoothClosed(g, PALM); g.fillStyle = gr; g.fill();
    g.strokeStyle = 'rgba(190,130,95,0.22)'; g.lineWidth = 2;
    for (const f of FING) { g.beginPath(); g.moveTo(f.b[0] * 0.35, -18); g.quadraticCurveTo(f.b[0] * 0.7, -50, f.b[0] * 0.92, f.b[1] + 14); g.stroke(); }
  }
  if (st.tool === 'tw') drawTweezers(g, tweezGeo(p.s || 0), sil);
  if (st.tool === 'tw' && !sil) {
    // ピンセットのうしろ側は手の甲の下に入る → 甲のふちを重ねる
  }
  if (st.thumbTop) drawFinger(g, geo.thumb, st, sil);
  for (let i = 3; i >= 0; i--) drawFinger(g, geo.fingers[i], st, sil);
}
// 影は別キャンバスにまとめて描いてからぼかす（重なりが濃くならない）
function shadowPass(drawFn, dx, dy, blur, alpha) {
  shCtx.setTransform(1, 0, 0, 1, 0, 0);
  shCtx.clearRect(0, 0, shC.width, shC.height);
  shCtx.setTransform(ctx.getTransform());
  shCtx.translate(dx, dy);
  drawFn(shCtx);
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = alpha; ctx.filter = `blur(${blur * SCALE * CAM.z}px)`;
  ctx.drawImage(shC, 0, 0); ctx.restore();
}
function drawHandBody(g, p, st, geo, sil) {
  const k = handK(p, st);
  g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(k, k);
  handLayer(g, p, geo, st, sil); g.restore();
}
function prepHand(p, st) {
  const q = { ...p };
  if (st.tool === 'tw') {
    const tw = tweezGeo(q.s || 0);
    q.ovr = [armPt(tw, 0.45, -1, 7), armPt(tw, 0.68, 1, 1), null, null, null];
  }
  return { q, geo: handGeo(q) };
}

// ===== 子どもの手：キーフレーム =====
const CHILD = { scale: 0.92, skin: '#f7cfab', line: '#c98f69', shade: 'rgba(196,132,96,0.75)', nail: '#fbe4d8', sleeve: '#8fd3a8', sleeveLine: '#5ea97b', cuff: '#7cc497' };
const TEACH = { scale: 1.06, skin: '#eebd96', line: '#b8835e', shade: 'rgba(170,112,80,0.75)', nail: '#f6dccd', sleeve: '#3d4f78', sleeveLine: '#26355a', cuff: '#33446a' };

function idxTipLocal(pose) { return handGeo(pose).fingers[0].pts[3]; }
function ptKey(t, preset, rot, z, tip, extra = {}) {
  const p = { ...POSE[preset], rot, z, s: 0, mode: 'free', tool: 'none', ...extra };
  return Object.assign(p, wristFor(p, idxTipLocal(p), tip, CHILD.scale), { t });
}
function gripKey(t, preset, center, rot, z, extra = {}) {
  const p = { ...POSE[preset], rot, z, s: 0, mode: 'free', tool: 'none', ...extra };
  return Object.assign(p, wristFor(p, GRIP_OFF, center, CHILD.scale), { t });
}
function twKey(t, rot, z, s, tip, extra = {}) {
  const p = { ...POSE.pinch, rot, z, s, mode: 'free', tool: 'tw', ...extra };
  return Object.assign(p, wristFor(p, tweezGeo(s).T, tip, CHILD.scale), { t });
}
const BLUE_REST = { x: 210, y: 320, ang: 0, z: 0, tilt: 0 };

// --- ② 注ぐ道すじ ---
const U = (ux, uy) => [MOLD.x + ux * MOLD.s, MOLD.y + uy * MOLD.s];
const POUR_PTS = [U(-0.05, -0.08), U(-0.22, 0.12), U(-0.42, -0.24), U(-0.12, -0.3), U(0.12, -0.3), U(0.42, -0.24), U(0.22, 0.12), U(0.2, 0.36), U(-0.2, 0.36), U(-0.02, 0.12)];
const POUR_T0 = 12.75, POUR_T1 = 20.0;
function crom(pts, v) {
  const n = pts.length - 1, f = clamp(v) * n, i = Math.min(n - 1, Math.floor(f)), u = f - i;
  const P = j => pts[clamp(j, 0, n)];
  const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
  const c = (a, b, c2, d) => 0.5 * ((2 * b) + (-a + c2) * u + (2 * a - 5 * b + 4 * c2 - d) * u * u + (-a + 3 * b - 3 * c2 + d) * u * u * u);
  return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];

  g.fillStyle = gr; g.fill();
  g.save(); tshirtPath(g, 0, 0, s); g.clip();
  tshirtPath(g, 0, 0, s); g.strokeStyle = 'rgba(190,225,255,0.9)'; g.lineWidth = 12; g.stroke();
  const sf = STAR_FINAL || { x: PLACE[0], y: PLACE[1], rot: 0.1 };
  const k = s / MOLD.s;
  drawStar(g, (sf.x - MOLD.x) * k, (sf.y - MOLD.y) * k, HERO_STAR.r * k, sf.rot);
  starPath(g, (sf.x - MOLD.x) * k, (sf.y - MOLD.y) * k, HERO_STAR.r * k, sf.rot); g.fillStyle = 'rgba(40,110,230,0.18)'; g.fill();
  g.lineCap = 'round';
  g.beginPath(); g.moveTo(-0.3 * s, -0.33 * s); g.quadraticCurveTo(-0.22 * s, -0.42 * s, -0.05 * s, -0.4 * s); g.strokeStyle = 'rgba(255,255,255,0.85)'; g.lineWidth = 0.03 * s; g.stroke();
  g.beginPath(); g.moveTo(-0.29 * s, -0.1 * s); g.lineTo(-0.29 * s, 0.25 * s); g.lineWidth = 0.022 * s; g.strokeStyle = 'rgba(255,255,255,0.55)'; g.stroke();
  // ひかりが すーっと とおる
  const sw = ((t - 54.2) / 2.2) % 1;
  if (t > 54.2) { const x = lerp(-0.9, 0.9, sw) * s; const lg = g.createLinearGradient(x - 0.15 * s, 0, x + 0.15 * s, 0); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(0.5, 'rgba(255,255,255,0.45)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = lg; g.fillRect(-s, -s, 2 * s, 2 * s); }
  g.restore();
  tshirtPath(g, 0, 0, s); g.strokeStyle = '#1a4fa8'; g.lineWidth = 3; g.stroke();
  g.restore();
  // きらきら
  const SP = [[-260, -150, 0], [270, -170, 0.4], [300, 120, 0.8], [-290, 140, 1.2], [-180, -230, 0.6], [190, 230, 1.0], [0, -250, 1.4]];
  for (const [dx, dy, o] of SP) { const q = Math.sin(Math.PI * (((t - 54 + o) / 1.6) % 1)); if (t > 54) sparkle(g, 640 + dx, 320 + dy, 22 * q, q * a); }
  // かみふぶき
  for (const c of CONF) {
    const tt = t - 54.0 - c.d; if (tt < 0) continue;
    const y = -20 + tt * c.sp, x = c.x + 25 * Math.sin(tt * 2 + c.sw);
    if (y > 600) continue;
    g.save(); g.translate(x, y); g.rotate(c.r + tt * c.vr); g.scale(1, Math.cos(tt * 4 + c.sw));
    g.fillStyle = c.c; g.fillRect(-c.w / 2, -c.w * 0.3, c.w, c.w * 0.6); g.restore();
  }
}

// ===== 1コマ描画 =====
function renderFrame(t) {
  CAM = camT(t);
  ctx.setTransform(SCALE, 0, 0, SCALE, 0, 0);
  ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.save();
  ctx.translate(W / 2, 335); ctx.scale(CAM.z, CAM.z); ctx.translate(-CAM.x, -CAM.y);
  drawTable(ctx);
  drawMold(ctx);
  drawResin(ctx, t);
  const star = heroStar(t);
  if (t >= 42.45 && !STAR_FINAL) STAR_FINAL = { x: star.x, y: star.y, rot: star.rot };
  drawTray(ctx, t, t >= 36.0);
  // おいてある びん
  const blue = blueBottle(t), blueHeld = t >= 8.2 && t < 23.4;
  for (const b of BOTTLES) {
    if (b.key === 'blue' && blueHeld) continue;
    const st = { x: b.x, y: b.y, ang: 0, z: 0, tilt: 0 };
    shadowPass(g => drawBottle(g, st, b.key, 1, true), 3, 5, 3, 0.25);
    drawBottle(ctx, st, b.key, b.key === 'blue' ? (t > 20 ? 0.72 : 1) : 1, false);
  }
  drawWorldLabels(ctx, t);
  drawUVLight(ctx, t);
  // 子どもの手（と持っているもの）
  const hp = childHand(t);
  const visibleChild = t >= 3.0 && t <= 45.3;
  if (visibleChild) {
    const st = { ...CHILD, tool: hp.tool, thumbTop: hp.tool === 'tw' };
    const { q, geo } = prepHand(hp, st);
    const sh = 5 + 24 * hp.z;
    shadowPass(g => {
      if (blueHeld) drawBottle(g, blue, 'blue', 1, true);
      if (star.held) drawStar(g, star.x, star.y, HERO_STAR.r * (1 + 0.07 * star.z), star.rot, true);
      drawHandBody(g, q, st, geo, true);
    }, sh * 0.55, sh, 3 + 5 * hp.z, 0.26 - 0.06 * hp.z);
    if (blueHeld) { drawBottle(ctx, blue, 'blue', lerp(1, 0.72, prog(t, POUR_T0, POUR_T1)), false); drawStream(ctx, t); }
    if (star.held && !star.inResin) drawStar(ctx, star.x, star.y, HERO_STAR.r * (1 + 0.07 * star.z), star.rot);
    drawHandBody(ctx, q, st, geo, false);
  }
  if (t >= POUR_T1 && t < 23.4) drawStream(ctx, t);
  // 先生の手（ライト）
  if (t > 45.4 && t < 53.6) {
    const tr = torchState(t), tp = teacherHand(t), st = { ...TEACH, tool: 'none' };
    const geo = handGeo(tp);
    shadowPass(g => { drawTorch(g, tr, 0, true); drawHandBody(g, tp, st, geo, true); }, 16, 28, 9, 0.2);
    drawTorch(ctx, tr, lightOn(t), false);
    drawLensGlow(ctx, t);
    drawHandBody(ctx, tp, st, geo, false);
  }
  ctx.restore();
  drawFinished(ctx, t);
  drawUI(ctx, t);
}
// STAR_FINAL を先に決めておく（シークしても同じ絵になるように）
{ const s = heroStar(45); STAR_FINAL = { x: s.x, y: s.y, rot: s.rot }; }

window.renderFrame = renderFrame;
window.DURATION = DURATION;

// ===== プレビュー再生 =====
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
document.fonts.load(`bold 40px ${FONT}`).then(() => {
  window.READY = true;
  if (isRender) return;
  const seek = document.getElementById('seek'), tm = document.getElementById('tm'), pp = document.getElementById('pp');
  let playing = true, t = 0, last = performance.now();
  pp.onclick = () => { playing = !playing; pp.textContent = playing ? '⏸' : '▶'; };
  seek.oninput = () => { t = +seek.value; };
  const loop = now => {
    const dt = (now - last) / 1000; last = now;
    if (playing) { t += dt; if (t > DURATION) t = 0; seek.value = t; }
    renderFrame(t); tm.textContent = t.toFixed(1);
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
</script>
